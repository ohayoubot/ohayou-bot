<!-- The brand mark: a sun over three acres. Drawn on the same 12x12 grid the
     item sprites use, in the same sixteen colours. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" shape-rendering="crispEdges" role="img" aria-label="hemera.day">
  <g fill="#FFFF00">
    <rect x="5" y="0" width="2" height="1"/>
    <rect x="4" y="1" width="4" height="1"/>
    <rect x="3" y="2" width="6" height="2"/>
    <rect x="4" y="4" width="4" height="1"/>
  </g>
  <g fill="#FC7E00">
    <rect x="1" y="2" width="1" height="1"/>
    <rect x="10" y="2" width="1" height="1"/>
    <rect x="0" y="3" width="1" height="1"/>
    <rect x="11" y="3" width="1" height="1"/>
    <rect x="2" y="4" width="1" height="1"/>
    <rect x="9" y="4" width="1" height="1"/>
    <rect x="5" y="5" width="2" height="1"/>
  </g>
  <g fill="#009300">
    <rect x="0" y="7" width="12" height="1"/>
  </g>
  <g fill="#3D2F18">
    <rect x="0" y="8" width="3" height="4"/>
    <rect x="4" y="8" width="4" height="4"/>
    <rect x="9" y="8" width="3" height="4"/>
  </g>
  <g fill="#00FC00">
    <rect x="1" y="9" width="1" height="1"/>
    <rect x="5" y="10" width="1" height="1"/>
    <rect x="10" y="9" width="1" height="1"/>
    <rect x="6" y="8" width="1" height="1"/>
  </g>
</svg>
