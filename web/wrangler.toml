name = "deerkins"
pages_build_output_dir = "public"
compatibility_date = "2025-07-01"

[[d1_databases]]
binding = "DB"
database_name = "deerkins"
database_id = "ec3b15b6-64ef-45ce-a8a7-d11ff3b842b7"

# Uploaded images. Served from PUBLIC_IMAGE_BASE
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "hemera"

[vars]
SAVES_PER_HOUR = "10"
GLOBAL_SAVES_PER_HOUR = "300"
UPLOADS_PER_HOUR = "20"
GLOBAL_UPLOADS_PER_HOUR = "200"
PUBLIC_IMAGE_BASE = "https://img.hemera.day"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "deerkins-preview"
database_id = "8b865cbc-148c-4dfb-8be8-932dc9ca5562"

[[env.preview.r2_buckets]]
binding = "UPLOADS"
bucket_name = "hemera-preview"

[env.preview.vars]
SAVES_PER_HOUR = "10"
GLOBAL_SAVES_PER_HOUR = "300"
UPLOADS_PER_HOUR = "20"
GLOBAL_UPLOADS_PER_HOUR = "200"
PUBLIC_IMAGE_BASE = "https://img-preview.hemera.day"
