name = "ohayou-web"
pages_build_output_dir = "public"
compatibility_date = "2025-07-01"

[[d1_databases]]
binding = "DB"
database_name = "ohayou-site"
database_id = "9e982cb2-7c94-4b3b-838f-20b5c7ea3f6a"

# The game's projection and request queue.
[[d1_databases]]
binding = "GAME"
database_name = "ohayou-game"
database_id = "10f2f682-f400-4206-ad72-9af665aba43d"

# Uploaded images. Served from PUBLIC_IMAGE_BASE
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "hemera"

[vars]
SAVES_PER_HOUR = "10"
GLOBAL_SAVES_PER_HOUR = "300"
COMMANDS_PER_HOUR = "30"
UPLOADS_PER_HOUR = "20"
GLOBAL_UPLOADS_PER_HOUR = "200"
PUBLIC_IMAGE_BASE = "https://img.hemera.day"
IRC_CHANNEL = "#ohayou"
IRC_NETWORK = "Rizon"
IRC_WEBCHAT = "https://qchat.rizon.net/?randomnick=1&channels=ohayou&uio=d4"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "ohayou-site-preview"
database_id = "ed613ea5-dcdc-4840-b910-ccddbc8fa29e"

[[env.preview.d1_databases]]
binding = "GAME"
database_name = "ohayou-game-preview"
database_id = "29a0e2dd-890c-48d0-b2a3-128506744744"

[[env.preview.r2_buckets]]
binding = "UPLOADS"
bucket_name = "hemera-preview"

[env.preview.vars]
SAVES_PER_HOUR = "10"
GLOBAL_SAVES_PER_HOUR = "300"
COMMANDS_PER_HOUR = "30"
UPLOADS_PER_HOUR = "20"
GLOBAL_UPLOADS_PER_HOUR = "200"
PUBLIC_IMAGE_BASE = "https://img-preview.hemera.day"
